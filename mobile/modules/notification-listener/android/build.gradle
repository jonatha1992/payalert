plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

group = 'com.tecnofusion.payalert.notificationlistener'
version = '1.0.0'

android {
  namespace 'com.tecnofusion.payalert.notificationlistener'
  compileSdkVersion safeExtGet('compileSdkVersion', 35)
  defaultConfig { minSdkVersion safeExtGet('minSdkVersion', 24) }
}

dependencies {
  implementation project(':expo-modules-core')
}

def safeExtGet(prop, fallback) { rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback }
