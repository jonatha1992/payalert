name: payalert
services:
  payalert:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_MP_OAUTH_ENABLED: ${NEXT_PUBLIC_MP_OAUTH_ENABLED:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: payalert-app
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      TZ: UTC
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.payalert.entrypoints=web
      - traefik.http.routers.payalert.rule=Host(`payalert.tecnofusion.dev`)
      - traefik.http.services.payalert.loadbalancer.server.port=3000
    networks:
      - default
      - edge
  webhook-cron:
    image: alpine:3.20
    container_name: payalert-cron
    restart: unless-stopped
    depends_on:
      - payalert
    environment:
      CRON_SECRET: ${CRON_SECRET}
      TZ: UTC
    volumes:
      - ./webhook-cron.sh:/usr/local/bin/webhook-cron.sh:ro
    command: ["sh", "-c", "echo '0 9 * * * sh /usr/local/bin/webhook-cron.sh' | crontab - && exec crond -f -l 8"]
networks:
  edge:
    external: true
